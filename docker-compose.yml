version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: finvault-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finvault-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/finvault
      - JWT_SECRET=super_secret_finvault_jwt_key_12345
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finvault-frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo-data:
